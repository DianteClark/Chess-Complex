<!DOCTYPE html><html><body style="margin:0;background:#000">
<canvas id="c" width="1024" height="1024"></canvas>
<script type="module">
import { drawPiece, getPath } from '../js/pieces.js';
window.render = (size, mask, frame = !mask) => {
  const c = document.getElementById('c'); c.width = c.height = size;
  const x = c.getContext('2d'); const S = size / 1024; x.setTransform(S, 0, 0, S, 0, 0);
  // background
  let g = x.createRadialGradient(512, 430, 40, 512, 512, 760);
  g.addColorStop(0, '#3b2a6a'); g.addColorStop(0.45, '#160f2c'); g.addColorStop(1, '#040308');
  x.fillStyle = g; x.fillRect(0, 0, 1024, 1024);
  // perspective chess floor
  x.save();
  const hz = 640;
  x.beginPath(); x.rect(0, hz, 1024, 384); x.clip();
  for (let r = 0; r < 8; r++) for (let cc = -8; cc < 16; cc++) {
    const y0 = hz + Math.pow(r / 8, 1.8) * 384, y1 = hz + Math.pow((r + 1) / 8, 1.8) * 384;
    const w0 = 40 + r * 0, sc0 = 0.25 + (y0 - hz) / 384 * 1.2, sc1 = 0.25 + (y1 - hz) / 384 * 1.2;
    const xa = 512 + (cc - 4) * 128 * sc0, xb = 512 + (cc - 3) * 128 * sc0, xc = 512 + (cc - 3) * 128 * sc1, xd = 512 + (cc - 4) * 128 * sc1;
    x.fillStyle = (r + cc) % 2 ? 'rgba(214,176,92,0.16)' : 'rgba(10,8,20,0.5)';
    x.beginPath(); x.moveTo(xa, y0); x.lineTo(xb, y0); x.lineTo(xc, y1); x.lineTo(xd, y1); x.closePath(); x.fill();
    void w0;
  }
  const fg = x.createLinearGradient(0, hz, 0, 1024); fg.addColorStop(0, 'rgba(4,3,8,0.9)'); fg.addColorStop(0.35, 'rgba(4,3,8,0)'); fg.addColorStop(1, 'rgba(4,3,8,0.6)');
  x.fillStyle = fg; x.fillRect(0, hz, 1024, 384);
  x.restore();
  // horizon glow
  g = x.createLinearGradient(0, hz - 80, 0, hz + 60); g.addColorStop(0, 'rgba(255,210,120,0)'); g.addColorStop(0.6, 'rgba(255,210,120,0.35)'); g.addColorStop(1, 'rgba(255,210,120,0)');
  x.fillStyle = g; x.fillRect(0, hz - 80, 1024, 140);
  // halo
  g = x.createRadialGradient(512, 440, 20, 512, 440, 420); g.addColorStop(0, 'rgba(255,220,140,0.55)'); g.addColorStop(0.4, 'rgba(255,190,80,0.18)'); g.addColorStop(1, 'rgba(255,190,80,0)');
  x.fillStyle = g; x.fillRect(0, 0, 1024, 1024);
  // light rays
  x.save(); x.translate(512, 420); x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 14; i++) { x.rotate(Math.PI * 2 / 14); const rg = x.createLinearGradient(0, 0, 0, -520); rg.addColorStop(0, 'rgba(255,220,150,0.12)'); rg.addColorStop(1, 'rgba(255,220,150,0)'); x.fillStyle = rg; x.beginPath(); x.moveTo(-14, 0); x.lineTo(14, 0); x.lineTo(60, -520); x.lineTo(-60, -520); x.closePath(); x.fill(); }
  x.restore();
  const k = mask ? 0.78 : 0.92; // safe zone for maskable
  x.save(); x.translate(512, 512); x.scale(k, k); x.translate(-512, -512);
  // shadow ellipse
  x.fillStyle = 'rgba(0,0,0,0.55)'; x.beginPath(); x.ellipse(512, 800, 230, 46, 0, 0, Math.PI * 2); x.fill();
  // knight
  x.save(); x.translate(512, 800); x.scale(560, 560);
  x.shadowColor = 'rgba(255,200,90,0.7)'; x.shadowBlur = 60 * S;
  drawPiece(x, 'knight', 'gilded', { t: 1.2 });
  x.shadowBlur = 0;
  const kp = getPath('knight');
  x.save(); x.clip(kp);
  const mg = x.createLinearGradient(-0.4, -1.2, 0.4, 0);
  mg.addColorStop(0, 'rgba(255,255,255,0.0)'); mg.addColorStop(0.28, 'rgba(255,255,255,0.55)'); mg.addColorStop(0.36, 'rgba(255,255,255,0)'); mg.addColorStop(0.62, 'rgba(120,70,0,0.35)'); mg.addColorStop(1, 'rgba(60,30,0,0.55)');
  x.fillStyle = mg; x.fillRect(-0.6, -1.4, 1.2, 1.5);
  const rim = x.createLinearGradient(0.1, 0, 0.42, 0); rim.addColorStop(0, 'rgba(255,240,200,0)'); rim.addColorStop(1, 'rgba(255,240,200,0.6)');
  x.fillStyle = rim; x.fillRect(0, -1.4, 0.6, 1.5);
  x.restore();
  x.strokeStyle = '#5a3a08'; x.lineWidth = 0.025; x.stroke(kp);
  x.restore();
  // crown
  x.save(); x.translate(560, 150); x.rotate(0.18); x.scale(330, 330);
  x.shadowColor = 'rgba(255,210,77,0.9)'; x.shadowBlur = 40 * S;
  x.fillStyle = '#ffd24d'; x.strokeStyle = '#6a4506'; x.lineWidth = 0.03;
  const cg = x.createLinearGradient(0, -0.2, 0, 0.15); cg.addColorStop(0, '#fff3c0'); cg.addColorStop(0.5, '#ffd24d'); cg.addColorStop(1, '#a87412'); x.fillStyle = cg;
  x.beginPath(); x.moveTo(-0.26, 0.12); x.lineTo(-0.3, -0.16); x.lineTo(-0.13, -0.02); x.lineTo(0, -0.22); x.lineTo(0.13, -0.02); x.lineTo(0.3, -0.16); x.lineTo(0.26, 0.12); x.closePath(); x.fill(); x.shadowBlur = 0; x.stroke();
  for (const [px, py] of [[-0.3, -0.18], [0, -0.24], [0.3, -0.18]]) { x.fillStyle = '#fff6d0'; x.beginPath(); x.arc(px, py, 0.035, 0, Math.PI * 2); x.fill(); }
  x.fillStyle = '#ff3b5c'; x.beginPath(); x.arc(0, 0.04, 0.045, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#7fe0ff'; x.beginPath(); x.arc(-0.15, 0.06, 0.028, 0, Math.PI * 2); x.arc(0.15, 0.06, 0.028, 0, Math.PI * 2); x.fill();
  x.restore();
  // orbiting shards
  const shard = (sx, sy, sc, rot) => { x.save(); x.translate(sx, sy); x.rotate(rot); x.scale(sc, sc); x.shadowColor = '#5fd8ff'; x.shadowBlur = 30 * S; x.fillStyle = '#5fd8ff'; x.beginPath(); x.moveTo(0, -1); x.lineTo(0.55, 0); x.lineTo(0, 0.9); x.lineTo(-0.55, 0); x.closePath(); x.fill(); x.shadowBlur = 0; x.fillStyle = '#e8fdff'; x.beginPath(); x.moveTo(0, -1); x.lineTo(0.2, 0); x.lineTo(0, 0.9); x.closePath(); x.fill(); x.restore(); };
  shard(250, 560, 46, -0.3); shard(790, 600, 38, 0.25); shard(300, 300, 26, 0.2); shard(770, 360, 22, -0.2);
  // sparkles
  const spark = (sx, sy, r) => { x.save(); x.translate(sx, sy); x.fillStyle = '#fff8e0'; x.shadowColor = '#ffe9a8'; x.shadowBlur = 20 * S; x.beginPath(); x.moveTo(0, -r); x.quadraticCurveTo(0, 0, r, 0); x.quadraticCurveTo(0, 0, 0, r); x.quadraticCurveTo(0, 0, -r, 0); x.quadraticCurveTo(0, 0, 0, -r); x.fill(); x.restore(); };
  spark(200, 420, 26); spark(840, 470, 20); spark(690, 250, 16); spark(380, 220, 12); spark(860, 760, 14);
  x.restore();
  if (frame) {
    // gold bevel frame
    x.lineWidth = 18; const bg2 = x.createLinearGradient(0, 0, 1024, 1024); bg2.addColorStop(0, '#fff0b8'); bg2.addColorStop(0.5, '#b78a33'); bg2.addColorStop(1, '#6b4a12');
    x.strokeStyle = bg2; x.globalAlpha = 0.9; x.strokeRect(9, 9, 1006, 1006); x.globalAlpha = 1;
  }
  // vignette
  g = x.createRadialGradient(512, 512, 380, 512, 512, 760); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.5)');
  x.fillStyle = g; x.fillRect(0, 0, 1024, 1024);
  return c.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
